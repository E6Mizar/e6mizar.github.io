<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E6 Mizar</title>
<meta name="theme-color" content="#1B2A4E">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="E6 Mizar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2A4E'/%3E%3Cpath d='M13 4l2 7 7 2-7 2-2 7-2-7-7-2 7-2z' fill='%23E9B23A'/%3E%3Ccircle cx='24' cy='24' r='2.6' fill='%23E9B23A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#16213A; --muted:#58637D; --line:#D8DEE8;
  --night:#1B2A4E; --night-2:#24365F; --night-ink:#F1F4FA; --night-muted:#AEB9D3;
  --star:#C98A10; --star-on-night:#E9B23A; --star-soft:#FBF1D9;
  --ok:#1E7D4E; --ok-bg:#DCF1E5; --no:#AE4239; --no-bg:#F8E1DE;
  --c3:#23867B; --c4:#3A62C2; --c1b:#7853A6; --c2b:#B53D57;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1525; --surface:#162038; --surface-2:#1B2742; --ink:#E7ECF6; --muted:#9CA8C2; --line:#2B3858;
    --night:#0A1121; --night-2:#152240; --night-ink:#EEF2FA; --night-muted:#93A0BE;
    --star:#EDBC4F; --star-on-night:#EDBC4F; --star-soft:#3A2F14;
    --ok:#53C48D; --ok-bg:#12382A; --no:#F07D72; --no-bg:#40201D;
    --c3:#3DB3A5; --c4:#6F93EA; --c1b:#A688D3; --c2b:#E2718A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#162038; --surface-2:#1B2742; --ink:#E7ECF6; --muted:#9CA8C2; --line:#2B3858;
  --night:#0A1121; --night-2:#152240; --night-ink:#EEF2FA; --night-muted:#93A0BE;
  --star:#EDBC4F; --star-on-night:#EDBC4F; --star-soft:#3A2F14;
  --ok:#53C48D; --ok-bg:#12382A; --no:#F07D72; --no-bg:#40201D;
  --c3:#3DB3A5; --c4:#6F93EA; --c1b:#A688D3; --c2b:#E2718A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}

/* Cabecera */
.aviso-demo{background:var(--star-soft);color:var(--ink);font-size:.88rem;padding:.5rem 1rem;text-align:center}
.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);color:var(--night-ink)}
.cab-fila{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem clamp(1rem,3vw,2rem) .3rem;max-width:1400px;margin:0 auto}
.marca{display:flex;align-items:center;gap:.55rem;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.marca .logo{width:30px;height:30px;color:var(--star-on-night)}
.quien{display:flex;align-items:center;gap:.8rem;text-align:right}
.quien strong{display:block;font-weight:600}
.quien small{display:block;color:var(--night-muted);font-size:.8rem}
.tabs{display:flex;gap:.2rem;overflow-x:auto;padding:0 clamp(.6rem,3vw,1.6rem);max-width:1400px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--night-muted);padding:.65rem .75rem .7rem;cursor:pointer;white-space:nowrap;font-weight:600;border-bottom:3px solid transparent}
.tab:hover{color:var(--night-ink)}
.tab.on{color:var(--night-ink);border-bottom-color:var(--star-on-night)}

/* Estructura */
.main{max-width:1400px;margin:0 auto;padding:1.2rem clamp(.8rem,3vw,2rem) 3rem}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin-bottom:1rem}
.ayuda{color:var(--muted);font-size:.9rem;margin:-.3rem 0 1rem}
.nota{color:var(--muted);font-size:.88rem;margin:.6rem 0 0}
.bloque{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1.1rem}
.bloque-cab{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.bloque-cab h2{font-size:1.25rem}
.punto{width:12px;height:12px;border-radius:50%;background:var(--cc);flex:none}
.meta{color:var(--muted);font-size:.9rem}
.vacio{border:1px dashed var(--line);border-radius:10px;padding:1.1rem;color:var(--muted);text-align:center;background:var(--surface-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1.1rem}
.panel h3{font-size:1.05rem;margin-bottom:.7rem}
h2.seccion{font-size:1.15rem;margin:1.6rem 0 .7rem}

/* Controles */
.btn{background:var(--night);color:var(--night-ink);border:1px solid var(--night);border-radius:9px;padding:.55rem 1rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--night-2)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.peq{padding:.35rem .7rem;font-size:.88rem}
.btn.peligro{background:var(--no);border-color:var(--no);color:#fff}
.btn.fantasma{background:transparent;border-color:var(--night-muted);color:var(--night-ink)}
.btn.ancho{width:100%}
.enlace{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:.2rem;font-size:.9rem}
.icono{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1}
.mesnav{display:flex;align-items:center;gap:.4rem}
.mes-label{font-family:var(--display);font-weight:700;font-size:1.15rem;min-width:11ch;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.38rem .8rem;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:.4rem}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.fijo{cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:.45rem .85rem;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button.on{background:var(--ink);color:var(--surface)}
select,input[type=text],input[type=email],input[type=password],input[type=date],input:not([type]){border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.5rem .65rem;min-height:40px;max-width:100%}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.88rem;font-weight:600;color:var(--muted)}
label input,label select{color:var(--ink);font-weight:400;font-size:1rem}
label.check{flex-direction:row;align-items:center;gap:.45rem;font-weight:500;color:var(--ink);font-size:.95rem}
label.sel{display:inline-flex}
.campos{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end}
.campos label{flex:1 1 180px}
fieldset{border:0;padding:0;margin:.9rem 0}
legend{font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
.cursos-check{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem}

/* Tabla de seguimiento */
.tabla-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tabla{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.tabla th,.tabla td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:center;vertical-align:middle}
.tabla thead th{background:var(--surface-2);font-size:.82rem;font-weight:600;color:var(--muted)}
.tabla th.grupo{font-family:var(--display);font-size:.9rem;color:var(--ink);text-align:left;padding:.5rem .6rem}
.tabla th.grupo.accion{border-top:3px solid var(--star)}
.tabla th.grupo.evento{border-top:3px solid var(--night-2)}
.tabla th.col{width:92px;min-width:92px;max-width:110px}
.tabla th.grupo.semanal{border-top:3px solid var(--ok)}
.tabla th.grupo.agregado{border-top:3px solid var(--muted)}
.tabla th.ini,.tabla td.ini{border-left:1px solid var(--line)}
.agr{display:inline-block;min-width:46px;padding:.45rem .3rem;border-radius:9px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums}
.col-nom{display:block;line-height:1.2;color:var(--ink)}
.col-fecha{display:block;font-size:.76rem;color:var(--muted);margin-top:.15rem}
.tabla .nom{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:150px;max-width:210px;padding-left:.7rem;border-right:1px solid var(--line)}
.tabla thead .nom{background:var(--surface-2);z-index:2}
.tabla .nom span{display:block;font-weight:600}
.tabla .nom small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.tabla tbody tr:hover td,.tabla tbody tr:hover .nom{background:var(--surface-2)}
.tabla tfoot td,.tabla tfoot th{background:var(--surface-2);font-weight:700;font-size:.88rem;border-bottom:0}
.celda{width:46px;height:40px;border-radius:9px;border:1.5px dashed var(--line);background:transparent;cursor:pointer;font-size:1.15rem;font-weight:700;line-height:1}
.celda.si{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.celda:active{transform:scale(.94)}

/* Listas */
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lista li:last-child{border-bottom:0}
.li-nom{flex:1 1 160px;font-weight:600}
.li-nom small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.estado-off{color:var(--no);font-size:.82rem;font-weight:600}
.bajas{margin-top:.8rem;color:var(--muted)}
.bajas summary{cursor:pointer;font-weight:600}

/* Resumen y dashboard */
.datos{border-collapse:collapse;width:100%;font-size:.93rem}
.datos th,.datos td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.datos thead th{font-size:.82rem;color:var(--muted);font-weight:600}
.datos td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{display:inline-block;width:80px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-left:.5rem;overflow:hidden}
.mini > span{display:block;height:100%;background:var(--ok);border-radius:4px}
.bajo .mini > span{background:var(--no)}
.bajo td:first-child{color:var(--no)}
.pendientes{margin-top:.8rem;padding:.7rem .8rem;background:var(--star-soft);border-radius:10px;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1.1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.kpi b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.9rem}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1.1rem}
.grafico{position:relative;height:280px}
.grafico.alto{height:auto;min-height:220px}
.envoltura{overflow-x:auto}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;background:
  radial-gradient(1.5px 1.5px at 18% 22%,var(--night-muted) 50%,transparent 51%),
  radial-gradient(1px 1px at 72% 14%,var(--night-muted) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 84% 64%,var(--night-muted) 50%,transparent 51%),
  radial-gradient(1px 1px at 30% 78%,var(--night-muted) 50%,transparent 51%),
  radial-gradient(1px 1px at 55% 42%,var(--night-muted) 50%,transparent 51%),
  var(--night)}
.login-caja{width:min(400px,100%);color:var(--night-ink)}
.login-caja .logo{width:64px;height:64px;color:var(--star-on-night)}
.login-caja h1{font-size:2.6rem;letter-spacing:-.02em;margin:.4rem 0 .2rem}
.login-caja .sub{color:var(--night-muted);margin:0 0 1.5rem}
.login-form{background:var(--surface);color:var(--ink);border-radius:16px;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.login-form .enlace{align-self:center;color:var(--muted)}
.error{color:var(--no);font-size:.9rem;margin:0;min-height:1.2em}
.ok-msg{color:var(--ok)}
.demo-accesos{margin-top:1.2rem}
.demo-accesos p{color:var(--night-muted);font-size:.9rem;margin:0 0 .5rem}
.demo-accesos div{display:flex;flex-wrap:wrap;gap:.4rem}
.demo-accesos button{background:var(--night-2);color:var(--night-ink);border:1px solid var(--night-muted);border-radius:999px;padding:.35rem .75rem;cursor:pointer;font-size:.85rem}
.centro{min-height:60vh;display:grid;place-items:center;text-align:center;padding:2rem;color:var(--muted)}

/* Modal y avisos */
.modal{border:0;border-radius:16px;padding:0;width:min(460px,calc(100% - 2rem));background:var(--surface);color:var(--ink)}
.modal::backdrop{background:rgba(10,17,33,.55)}
.modal form{padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.modal h3{font-size:1.2rem}
.modal-cuerpo{display:flex;flex-direction:column;gap:.8rem}
.modal-cuerpo p{margin:0;color:var(--muted)}
.modal-pie{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.4rem}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--surface);padding:.65rem 1rem;border-radius:10px;font-weight:600;font-size:.92rem;z-index:50;transition:transform .25s;max-width:calc(100% - 2rem)}
#toast.ver{transform:translate(-50%,0)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--star-on-night);color:#1B2A4E;border:0;font-family:var(--display);font-weight:700;font-size:1.15rem;cursor:pointer;flex:none}
.quien-txt{text-align:right}
.abajo{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--night);padding:.25rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));justify-content:space-around;border-top:1px solid var(--night-2)}
.ab{flex:1;background:none;border:0;color:var(--night-muted);display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.72rem;font-weight:600;padding:.4rem 0;cursor:pointer}
.ab svg{width:24px;height:24px}
.ab.on{color:var(--star-on-night)}
.fichas{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.ficha{border:1px solid var(--line);border-radius:12px;padding:.7rem}
.ficha-cab{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.55rem}
.ficha-cab small{color:var(--muted);font-size:.82rem}
.ficha-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip-m{border:1.5px dashed var(--line);background:transparent;border-radius:999px;padding:.45rem .85rem;font-weight:600;font-size:.92rem;cursor:pointer;min-height:42px}
.chip-m.si{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.chip-m small{color:var(--muted);font-weight:400}
.chip-dato{padding:.45rem .85rem;border-radius:999px;background:var(--surface-2);font-size:.92rem;min-height:42px;display:inline-flex;align-items:center;gap:.3rem}
.menu-lista{display:flex;flex-direction:column;gap:.5rem}
.menu-lista .btn{width:100%;text-align:left}
@media (max-width:760px){ .tabs{display:none} .abajo{display:flex} .main{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))} #toast{bottom:calc(5.2rem + env(safe-area-inset-bottom,0px))} .quien-txt{display:none} }

.inds{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:.5rem}
.ind{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem .85rem;border:1px solid var(--line);border-radius:10px}
.ind span{font-weight:600}
.ind small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:.15rem}
.ind b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ind small.aviso-f{color:var(--no)}
.tabla.hist td{min-width:54px;font-variant-numeric:tabular-nums}
.tabla .mes-act{background:var(--star-soft)}
.fila-inf{border-bottom:1px solid var(--line);padding-bottom:.7rem;margin-bottom:.7rem}
.solo-print{display:none}
@page{size:A4 landscape;margin:12mm}
@media print{
  :root{--ink:#111;--muted:#555;--line:#ccc;--surface:#fff;--surface-2:#f4f4f4;--star-soft:#fff3d6;padding:0}
  body{background:#fff;color:#111}
  body::before,.cab,.abajo,.aviso-demo,.no-print,#toast{display:none!important}
  .solo-print{display:block;font-size:16pt;margin:0 0 4mm}
  .main{padding:0;max-width:none}
  .bloque{border:1px solid #ccc;break-inside:avoid;background:#fff;margin-bottom:5mm}
  .tabla-wrap{overflow:visible;border:0}
  .tabla{width:100%;font-size:8.5pt}
  .tabla .nom{position:static;min-width:0}
  .ind{padding:2mm 3mm} .ind b{font-size:14pt}
}
.area{font:inherit;border:1px solid var(--line);border-radius:9px;padding:.5rem;background:var(--surface);color:var(--ink);width:100%}
.nuevo{display:inline-block;background:var(--star);color:#1B2A4E;border-radius:6px;padding:0 .4rem;font-size:.75rem;font-weight:700}
.m-tit{margin:.4rem 0 0;font-family:var(--display);font-size:1rem}
.m-aviso{margin:0;white-space:pre-wrap}
.m-aviso small{display:block;color:var(--muted);font-size:.8rem}
.man{border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem}
.man summary{cursor:pointer;font-weight:600}
.man p{margin:.5rem 0 0;color:var(--ink)}
@media print{ .w-chicos,.w-ctrl{display:none!important} .dash{display:block} .dash .bloque{margin-bottom:5mm} }
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4rem;vertical-align:middle;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.medio{background:var(--star)} .dot.bajo{background:var(--no)}
.falta{margin:-.2rem 0 .5rem;font-size:.85rem;color:var(--no)}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.paso{flex:1 1 100%;display:flex;align-items:center;gap:.5rem;padding:.25rem 0;border-bottom:1px dashed var(--line)}
.paso span{flex:1;font-weight:600}
.paso small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.paso b{min-width:2ch;text-align:center;font-size:1.25rem;font-variant-numeric:tabular-nums}
.paso b.ok{color:var(--ok)}
.paso .icono{width:44px;height:44px;font-size:1.3rem}
.paso .icono:disabled{opacity:.35}
select.num{width:58px;min-height:40px;text-align:center;padding:.3rem}
select.num.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);font-weight:700}

<script>
/* ============================ Constantes ============================ */
const CURSOS = [

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ============================ Utilidades ============================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const hoyMes = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1); };
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mesLargo = m => { const [y,mm] = m.split('-'); return MESES[+mm-1] + ' de ' + y; };
const fechaCorta = f => { const [,m,d] = f.split('-'); return d ? (+d) + '/' + (+m) : MESES[+m-1].slice(0,3); };
const fechaLarga = f => { const [y,m,d] = f.split('-'); return (d ? (+d) + ' de ' : '') + MESES[+m-1] + ' de ' + y; };
const mesMas = (m,dl) => { let [y,mm] = m.split('-').map(Number); mm += dl; while(mm>12){mm-=12;y++} while(mm<1){mm+=12;y--} return y + '-' + pad(mm); };
const cursoEscolarDe = m => { const [y,mm] = m.split('-').map(Number); return mm >= 9 ? y : y-1; };
const cursoEscolarActual = () => cursoEscolarDe(hoyMes());
const mesesCurso = y => { const r = []; for(let i=0;i<10;i++){ const mm = (8+i)%12+1; r.push((i<4?y:y+1) + '-' + pad(mm)); } return r; };
const isoD = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); };
const lunesDe = s => { const d = parseD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoD(d); };
const mesDeSemana = l => addD(l, 3).slice(0,7); // la semana cuenta en el mes de su jueves
const semanasMes = m => { let l = lunesDe(m + '-01'); if(mesDeSemana(l) !== m) l = addD(l, 7); const r = []; while(mesDeSemana(l) === m){ r.push(l); l = addD(l, 7); } return r; };
const semanaCorta = l => { const a = parseD(l), b = parseD(addD(l,6)); const ma = MESES[a.getMonth()].slice(0,3), mb = MESES[b.getMonth()].slice(0,3); return ma === mb ? `${a.getDate()}-${b.getDate()} ${mb}` : `${a.getDate()} ${ma}-${b.getDate()} ${mb}`; };
const textoSemana = l => { const a = parseD(l), b = parseD(addD(l,6)); return a.getMonth() === b.getMonth() ? `Del ${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]}` : `Del ${a.getDate()} de ${MESES[a.getMonth()]} al ${b.getDate()} de ${MESES[b.getMonth()]}`; };
const AGREG = {suma:'Suma de semanas asistidas', media:'Media (% de semanas)', alguna:'Al menos una vez al mes', todas:'Todas las semanas del mes'};
const AGREG_CORTO = {suma:'Suma', media:'Media', alguna:'Al menos una', todas:'Todas'};

/* ===================== Almacén: modo demostración ===================== */
function rndSemilla(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const usuarioDe = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9._-]/g,'');
const correoDe = u => String(u).trim().toLowerCase() + '@' + DOMINIO;
function semillaDemo(){
  const db = {usuarios:{}, chicos:{}, eventos:{}, registros:{}, config:{migracion:{v2:true}}, sugerencias:{}};
  db.usuarios.u_nacho = {nombre:'Nacho', usuario:'nacho', rol:'superadmin', curso:'', activo:true};
  db.usuarios.u_jotas = {nombre:'Jotas', usuario:'jotas', rol:'admin', curso:'', activo:true};
  const resp = {'3ESO':['Álvaro','Diego'], '4ESO':['Pablo','Javier'], '1BACH':['Miguel','Íñigo'], '2BACH':['Andrés','Luis']};
  const nombres = ['Carlos M.','Jaime R.','Lucas G.','Mateo F.','Hugo S.','Daniel P.','Martín L.','Leo A.','Marcos V.','Adrián T.','Bruno C.','Gonzalo D.','Íker N.','Rodrigo B.','Tomás H.','Nicolás E.','Samuel O.','Álex Q.','Enrique J.','Fernando K.','Ignacio U.','Pedro Y.','Rafael Z.','Víctor W.'];
  let n = 0;
  for(const c of CURSOS){
    const rs = resp[c.id].map((nm,i) => { const id = 'u_' + c.id.toLowerCase() + i; db.usuarios[id] = {nombre:nm, usuario:usuarioDe(nm), rol:'responsable', curso:c.id, activo:true}; return id; });
    for(let k=0;k<6;k++){ db.chicos['ch'+n] = {nombre:nombres[n], curso:c.id, responsable:rs[k%2], grupo:k%3 ? 'circulo' : 'charla', activo:true}; n++; }
  }
  const A = [['csr','Círculo','csr','numero','media_semana',4,'mes','circulo'],['med','Meditación','med','numero','media_semana',2,'mes',''],['precp','Preceptuación','precp','numero','suma',2,'mes',''],
    ['rtm','Retiro mensual','rtm','sino','chicos',1,'mes',''],['vp','Visita de pobres','vp','numero','suma',null,'mes',''],['padres','Conversación con padres','padres','numero','suma',1,'trimestre',''],['charla','Charlas','charla','numero','chicos',null,'mes','charla']];
  A.forEach(([id,nombre,abrev,dato,total,esperado,periodo,grupo],i) => db.eventos[id] = {v:2, nombre, abrev, dato, total, esperado, periodo, grupo, cursos:[], orden:i+1});
  const rnd = rndSemilla(11); const meses = mesesCurso(cursoEscolarActual()).filter(m => m <= hoyMes());
  Object.entries(db.chicos).forEach(([id,ch]) => { const k = .35 + rnd()*.6;
    meses.forEach(m => { const mc = {}; const r = x => Math.round(rnd() * x * k);
      if(ch.grupo === 'circulo') mc.n_csr = r(4); else mc.n_charla = r(2);
      mc.n_med = r(3); mc.n_precp = r(3); mc.n_rtm = rnd() < k ? 1 : 0; mc.n_vp = rnd() < .3 ? 1 : 0; mc.n_padres = rnd() < .25 ? 1 : 0;
      db.registros[id+'_'+m] = {chicoId:id, curso:ch.curso, mes:m, marcas:mc}; }); });
  return db;
}
function crearDemo(){
  const KEY = 'e6mizar-demo-v5';
  let mem = null; const escuchas = []; let authCb = null;
  const cargar = () => { if(mem) return mem; try{ const t = localStorage.getItem(KEY); if(t) mem = JSON.parse(t); }catch(e){} if(!mem){ mem = semillaDemo(); guardar(); } return mem; };
  const guardar = () => { try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} };
  const consulta = (col, f) => Object.entries(cargar()[col] || {}).map(([id,v]) => ({id, ...v})).filter(x => !f || x[f[0]] === f[1]);
  const emitir = col => escuchas.filter(l => l.col === col).forEach(l => l.cb(consulta(col, l.f)));
  const sesion = { get(){ try{ return sessionStorage.getItem(KEY+'-u'); }catch(e){ return this.v; } }, set(v){ this.v = v; try{ v ? sessionStorage.setItem(KEY+'-u', v) : sessionStorage.removeItem(KEY+'-u'); }catch(e){} } };
  return {
    demo:true,
    demoUsuarios(){ return consulta('usuarios').filter(u => u.activo !== false); },
    async estadoArranque(){ return true; },
    onAuth(cb){ authCb = cb; const s = sesion.get(); const u = s && cargar().usuarios[s]; setTimeout(() => cb(u ? {uid:s} : null), 0); },
    async login(usuario, pass){
      const e = Object.entries(cargar().usuarios).find(([,u]) => u.usuario === String(usuario).trim().toLowerCase());
      if(!e || pass !== 'demo') throw new Error('Usuario o contraseña incorrectos. En la demostración, la contraseña es «demo».');
      sesion.set(e[0]); authCb({uid:e[0]});
    },
    async logout(){ sesion.set(null); authCb(null); },
    async cambiarPassword(){ throw new Error('En la demostración no se pueden cambiar contraseñas.'); },
    async getProfile(id){ const u = cargar().usuarios[id]; return u ? {id, ...u} : null; },
    async createUser({usuario, password, ...perfil}){
      const db = cargar(); usuario = String(usuario).trim().toLowerCase();
      if(Object.values(db.usuarios).some(u => u.usuario === usuario)) throw new Error('Ese nombre de usuario ya existe.');
      const id = nuevoId(); db.usuarios[id] = {usuario, ...perfil}; guardar(); emitir('usuarios'); return id;
    },
    watch(col, f, cb){ const l = {col, f, cb}; escuchas.push(l); setTimeout(() => cb(consulta(col, f)), 0); return () => { const i = escuchas.indexOf(l); if(i >= 0) escuchas.splice(i,1); }; },
    async set(col, id, data, merge){
      const db = cargar(); db[col] = db[col] || {};
      const prev = db[col][id];
      if(merge && prev){ const n = {...prev, ...data}; if(data.marcas) n.marcas = {...(prev.marcas||{}), ...data.marcas}; db[col][id] = n; }
      else db[col][id] = data;
      guardar(); emitir(col);
    },
    async add(col, data){ const id = nuevoId(); await this.set(col, id, data, false); return id; },
    async del(col, id){ const db = cargar(); if(db[col]) delete db[col][id]; guardar(); emitir(col); },
    restablecer(){ mem = semillaDemo(); guardar(); ['usuarios','chicos','eventos','registros','config','sugerencias'].forEach(emitir); }
  };
}

/* ========================= Almacén: Firebase ========================= */
function errAuth(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) return 'Usuario o contraseña incorrectos.';
  if(/email-already-in-use/.test(c)) return 'Ese nombre de usuario ya existe.';
  if(/weak-password/.test(c)) return 'La contraseña debe tener al menos 6 caracteres.';
  if(/too-many-requests/.test(c)) return 'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  if(/requires-recent-login/.test(c)) return 'Por seguridad, sal y vuelve a entrar antes de cambiar la contraseña.';
  if(/network/.test(c)) return 'Sin conexión. Comprueba internet y vuelve a probar.';
  return 'No se pudo completar la operación (' + (c || 'error desconocido') + ').';
}
async function crearFirebase(){
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [AP, A, F] = await Promise.all([import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-firestore.js')]);
  const app = AP.initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app); const db = F.getFirestore(app);
  try{ await A.setPersistence(auth, A.browserSessionPersistence); }catch(e){}
  let secundaria = null;
  return {
    demo:false,
    async estadoArranque(){ const s = await F.getDoc(F.doc(db,'config','arranque')); return s.exists(); },
    async registrarPrincipal(usuario, pass){
      try{ const c = await A.createUserWithEmailAndPassword(auth, correoDe(usuario), pass); return c.user.uid; }
      catch(e){ if(/email-already-in-use/.test(e.code||'')){ try{ const c = await A.signInWithEmailAndPassword(auth, correoDe(usuario), pass); return c.user.uid; }catch(x){ throw new Error(errAuth(x)); } } throw new Error(errAuth(e)); }
    },
    onAuth(cb){ A.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid} : null)); },
    async login(usuario, pass){ try{ await A.signInWithEmailAndPassword(auth, correoDe(usuario), pass); }catch(e){ throw new Error(errAuth(e)); } },
    async logout(){ await A.signOut(auth); },
    async cambiarPassword(actual, nueva){
      const u = auth.currentUser;
      try{ await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, actual)); await A.updatePassword(u, nueva); }
      catch(e){ throw new Error(/invalid-credential|wrong-password/.test(e.code||'') ? 'La contraseña actual no es correcta.' : errAuth(e)); }
    },
    async getProfile(id){ const s = await F.getDoc(F.doc(db,'usuarios',id)); return s.exists() ? {id:s.id, ...s.data()} : null; },
    async createUser({usuario, password, ...perfil}){
      if(!secundaria) secundaria = AP.initializeApp(FIREBASE_CONFIG, 'altas');
      const sa = A.getAuth(secundaria); let cred; usuario = String(usuario).trim().toLowerCase();
      try{ cred = await A.createUserWithEmailAndPassword(sa, correoDe(usuario), password); }catch(e){ throw new Error(errAuth(e)); }
      await A.signOut(sa);
      await F.setDoc(F.doc(db,'usuarios',cred.user.uid), {usuario, ...perfil});
      return cred.user.uid;
    },
    watch(col, f, cb){
      const ref = f ? F.query(F.collection(db,col), F.where(f[0],'==',f[1])) : F.collection(db,col);
      return F.onSnapshot(ref, s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), e => { console.error(col, e); toast('No se pudieron leer los datos. Revisa las reglas de Firebase.'); });
    },
    async set(col, id, data, merge){ await F.setDoc(F.doc(db,col,id), data, {merge:!!merge}); },
    async add(col, data){ const r = await F.addDoc(F.collection(db,col), data); return r.id; },
    async del(col, id){ await F.deleteDoc(F.doc(db,col,id)); }
  };
}

/* ============================== Estado ============================== */
let DB;
const S = {user:null, profile:null, usuarios:[], chicos:[], eventos:[], registros:[], config:[], reg:{}, unsubs:[],
  view:'seguimiento', mes:hoyMes(), curso:'todos', filtro:'mios', filtroResp:'todos', anio:cursoEscolarActual(), dashAccion:null, modo:'semana', semana:lunesDe(hoyISO()), sugerencias:[], graficos:[], dashEdit:false, vista:(window.innerWidth < 760) ? 'fichas' : 'tabla', dashPor:'curso', infNombres:false, arrancando:false, pend:false, charts:[]};

const esAdmin = () => !!S.profile && (S.profile.rol === 'admin' || S.profile.rol === 'superadmin');
const esPrincipal = () => !!S.profile && S.profile.rol === 'superadmin';
const TIPOS = {semanal:'Semanal (se marca cada semana)', mensual:'Mensual (una vez al mes)', trimestral:'Trimestral (una vez por trimestre)', ocasional:'Ocasional (en una fecha; por ejemplo, convivencias)', anual:'Anual (una vez por curso; fecha opcional)'};
const tipoDe = e => ['semanal','mensual','trimestral','ocasional'].includes(e.tipo) ? e.tipo : 'anual';
const esMensual = e => e.tipo === 'mensual';
const esAnual = e => tipoDe(e) === 'anual';
const enRango = (e, m) => (!e.desde || e.desde.slice(0,7) <= m) && (!e.hasta || e.hasta.slice(0,7) >= m);
const activaMes = (e, m) => esMensual(e) && enRango(e, m);
const esTrimestral = e => e.tipo === 'trimestral';
const esOcasional = e => e.tipo === 'ocasional';
const mesInicioTrim = m => { const [y,mm] = m.split('-').map(Number); return y + '-' + pad(Math.floor((mm-1)/3)*3+1); };
const mesesTrim = m => { const i = mesInicioTrim(m); return [i, mesMas(i,1), mesMas(i,2)]; };
const textoTrim = m => { const ms = mesesTrim(m); return MESES[+ms[0].slice(5)-1].slice(0,3) + '-' + MESES[+ms[2].slice(5)-1].slice(0,3); };
const activaTrim = (e, m) => esTrimestral(e) && mesesTrim(m).some(x => enRango(e, x));
const anualSinFecha = e => tipoDe(e) === 'anual' && !e.fecha;
const conFecha = e => (tipoDe(e) === 'anual' || esOcasional(e)) && !!e.fecha;
const mesAnualSF = m => cursoEscolarDe(m) + '-09';
const porOrden = (a,b) => (a.orden ?? 1e15) - (b.orden ?? 1e15) || (a.nombre||'').localeCompare(b.nombre||'', 'es');
// actividades mensuales que afectan a alguno de esos cursos y están activas en alguno de esos meses
const acciones = (cursos = CURSOS.map(c => c.id), meses = null) => S.eventos.filter(e => esMensual(e) && cursos.some(c => aplica(e, c)) && (!meses || meses.some(m => activaMes(e, m)))).sort(porOrden);
function cuentaMensual(e, chicos, m){ if(!activaMes(e, m)) return {si:0, no:0, vacio:0, total:0}; return cuenta(chicos.filter(x => aplica(e, x.curso)), m, 'a_' + e.id); }
const cursosSel = () => esAdmin() ? (S.curso === 'todos' ? CURSOS.map(c => c.id) : [S.curso]) : [S.profile.curso];
const porNombre = (a,b) => (a.nombre||'').localeCompare(b.nombre||'', 'es');
const chicosDe = c => S.chicos.filter(x => x.curso === c && x.activo !== false).sort(porNombre);
const responsablesDe = c => S.usuarios.filter(u => ((u.rol === 'responsable' && u.curso === c) || u.rol === 'superadmin') && u.activo !== false).sort(porNombre);
const nombreUsuario = id => (S.usuarios.find(u => u.id === id) || {}).nombre || '';
const aplica = (ev, c) => !ev.cursos || !ev.cursos.length || ev.cursos.includes(c);
const esSemanal = e => e.tipo === 'semanal';
const eventosMes = (c, m) => S.eventos.filter(e => conFecha(e) && e.fecha.slice(0,7) === m && aplica(e,c)).sort((a,b) => a.fecha.localeCompare(b.fecha));
const activa = (e, l) => esSemanal(e) && (!e.desde || e.desde <= addD(l,6)) && (!e.hasta || e.hasta >= l);
const semanalesMes = (c, m) => S.eventos.filter(e => aplica(e,c) && semanasMes(m).some(l => activa(e,l))).sort(porNombre);
const semanasComputables = (e, m) => semanasMes(m).filter(l => l <= hoyISO() && activa(e, l));
function agregado(chicoId, e, m){
  const ws = semanasComputables(e, m); const n = ws.length;
  const si = ws.filter(l => valor(chicoId, m, `s_${e.id}_${l}`) === 'si').length;
  const modo = e.agregacion || 'suma';
  if(!n) return {txt:'—', num:null, ok:null, si, n};
  if(modo === 'suma') return {txt:String(si), num:si, si, n};
  if(modo === 'media'){ const p = pct(si, n); return {txt:p + '%', num:p, si, n}; }
  const ok = modo === 'alguna' ? si > 0 : si === n;
  return {txt:ok ? 'Sí' : 'No', num:ok ? 'Sí' : 'No', ok, si, n};
}
function agregadoCurso(chicos, e, m){
  const n = semanasComputables(e, m).length; if(!n || !chicos.length) return {txt:'—', p:null};
  const rs = chicos.map(x => agregado(x.id, e, m)); const tot = rs.reduce((s,r) => s + r.si, 0); const p = pct(tot, n * chicos.length);
  const modo = e.agregacion || 'suma';
  if(modo === 'suma') return {txt:String(tot), largo:`${tot} asistencias en ${n} ${n===1?'semana':'semanas'}, media de ${(tot/chicos.length).toLocaleString('es-ES',{maximumFractionDigits:1})} por chico`, p};
  if(modo === 'media') return {txt:p + '%', largo:`${p}% de las semanas`, p};
  const k = rs.filter(r => r.ok).length;
  return {txt:`${k}/${chicos.length}`, largo:`${k} de ${chicos.length} chicos ${modo === 'alguna' ? 'fueron al menos una vez' : 'fueron todas las semanas'}`, p:pct(k, chicos.length)};
}
const valor = (chico, m, key) => (S.reg[chico+'_'+m] || {})[key] === 'si' ? 'si' : '';
const txtValor = v => v === 'si' ? 'Sí' : v === 'no' ? 'No' : '';
function cuenta(chicos, m, key){ let si = 0, no = 0; for(const c of chicos){ const v = valor(c.id, m, key); if(v === 'si') si++; else if(v === 'no') no++; } return {si, no, vacio:chicos.length-si-no, total:chicos.length}; }
function asistenciaMedia(chicos, evs, m){ let si = 0, tot = 0; evs.forEach(e => { const r = cuenta(chicos, m, 'e_'+e.id); si += r.si; tot += r.total; }); return pct(si, tot); }
function nombreResp(x){ const r = S.usuarios.find(u => u.id === x.responsable && u.activo !== false && (u.rol === 'superadmin' || (u.rol === 'responsable' && u.curso === x.curso))); return r ? r.nombre : 'Sin preceptor'; }

/* ============================ Arranque ============================ */
async function arrancar(){
  try{ DB = DEMO ? crearDemo() : await crearFirebase(); }
  catch(e){ console.error(e); document.getElementById('app').innerHTML = `<div class="centro"><p>No se pudo cargar Firebase. Comprueba la conexión y los datos de configuración.</p></div>`; return; }
  DB.onAuth(u => { if(!S.arrancando) procesarAuth(u); });
}
async function procesarAuth(u){
  pararEscuchas(); S.user = u; S.profile = null;
  if(!u){
    let listo = true; try{ listo = await DB.estadoArranque(); }catch(e){ console.error(e); }
    listo ? renderLogin() : renderArranque(); return;
  }
  document.getElementById('app').innerHTML = '<div class="centro"><p>Cargando…</p></div>';
  let p = null; try{ p = await DB.getProfile(u.uid); }catch(e){ console.error(e); }
  if(!p || p.activo === false){ renderSinAcceso('Este acceso no está activo. Pide a un administrador que te dé uno nuevo.'); return; }
  if(p.rol === 'responsable' && !p.curso){ renderSinAcceso('Tu cuenta no tiene curso asignado. Pide a un administrador que te lo asigne.'); return; }
  S.profile = p; iniciarEscuchas();
}
function pararEscuchas(){ S.unsubs.forEach(f => { try{ f(); }catch(e){} }); S.unsubs = []; }
function iniciarEscuchas(){
  const adm = esAdmin(); const f = adm ? null : ['curso', S.profile.curso];
  S.curso = adm ? 'todos' : S.profile.curso; S.filtroResp = 'todos'; S.modo = 'semana'; S.semana = lunesDe(hoyISO()); S.mes = hoyMes(); S.view = 'seguimiento'; S.dashEdit = false; S.popups = false; S.periodo = 'mes';
  const listo = {}; const need = ['usuarios','chicos','eventos','registros','config'];
  if(esPrincipal()) need.push('sugerencias'); else S.sugerencias = [];
  const on = col => docs => {
    S[col] = docs;
    if(col === 'registros'){ S.reg = {}; docs.forEach(r => { S.reg[r.id] = r.marcas || {}; }); }
    if(col === 'sugerencias') docs.filter(x => x.estado === 'vista' && x.resuelta && Date.now() - Date.parse(x.resuelta) > 15 * 864e5).forEach(x => DB.del('sugerencias', x.id).catch(() => {}));
    if(col === 'usuarios' && revisarPerfil()) return;
    listo[col] = true; if(need.every(k => listo[k])) render();
  };
  S.unsubs = [
    DB.watch('usuarios', null, on('usuarios')),
    DB.watch('chicos', f, on('chicos')),
    DB.watch('eventos', null, on('eventos')),
    DB.watch('registros', f, on('registros')),
    DB.watch('config', null, on('config'))
  ];
  if(esPrincipal()) S.unsubs.push(DB.watch('sugerencias', null, on('sugerencias')));
}
function revisarPerfil(){
  const me = S.usuarios.find(u => u.id === S.user.uid); if(!me) return false;
  if(me.activo === false){ DB.logout(); return true; }
  const cambio = me.rol !== S.profile.rol || me.curso !== S.profile.curso;
  S.profile = me;
  if(cambio){ pararEscuchas(); iniciarEscuchas(); return true; }
  return false;
}

/* ============================ Actividades: modelo simple ============================ */
const DATOS = {numero:'Número de veces', sino:'Sí o no'};
const TOTALES = {suma:'Suma de todas las veces', media_semana:'Media por semana', chicos:'Nº de chicos que han ido'};
const TOT_CORTO = {suma:'total', media_semana:'media por semana', chicos:'chicos que han ido'};
const esAct = e => e.v === 2;
const actividades = c => S.eventos.filter(e => esAct(e) && (!c || aplica(e, c))).sort(porOrden);
const etiq = a => a.abrev || a.nombre;
const kAct = a => 'n_' + a.id;
const num = (chico, m, a) => { const v = (S.reg[chico+'_'+m] || {})[kAct(a)]; return typeof v === 'number' ? v : 0; };
const periodoDe = (a, m) => a.periodo === 'trimestre' ? mesesTrim(m).filter(x => x <= m) : [m];
const hechoPeriodo = (a, x, m) => periodoDe(a, m).reduce((t, mm) => t + num(x.id, mm, a), 0);
const leToca = (a, x) => !!a.esperado && (!a.grupo || x.grupo === a.grupo);
const cumple = (a, x, m) => a.esperado ? hechoPeriodo(a, x, m) >= a.esperado : null;
function totalAct(a, ch, meses){
  const cc = ch.filter(x => aplica(a, x.curso)); meses = meses.filter(m => m <= hoyMes()); if(!meses.length) return null;
  if(a.total === 'chicos') return cc.filter(x => meses.some(m => num(x.id, m, a) > 0)).length;
  const s = cc.reduce((t, x) => t + meses.reduce((u, m) => u + num(x.id, m, a), 0), 0);
  if(a.total === 'media_semana'){ const w = meses.reduce((t, m) => t + semanasMes(m).length, 0); return w ? Math.round(s / w * 10) / 10 : null; }
  return s;
}
function cumplen(a, ch, m){ const cc = ch.filter(x => aplica(a, x.curso) && leToca(a, x)); if(!a.esperado || !cc.length) return null; const k = cc.filter(x => cumple(a, x, m)).length; return {k, n:cc.length, p:pct(k, cc.length)}; }
const colorP = p => p === null || p === undefined ? 'neutro' : p >= 80 ? 'ok' : p >= 50 ? 'medio' : 'bajo';
function iniciales(n){ const p = String(n || '').trim().split(/\s+/).filter(Boolean); return (p.length > 1 ? p.map(w => w[0]).join('') : (p[0] || '').slice(0,3)).toUpperCase().slice(0,3); }
function estadoChico(x, m){ const acts = actividades(x.curso).filter(a => leToca(a, x)); if(!acts.length) return null; const k = acts.filter(a => cumple(a, x, m)).length; return k === acts.length ? 'ok' : k * 2 >= acts.length ? 'medio' : 'bajo'; }
const faltan = (x, m) => actividades(x.curso).filter(a => leToca(a, x)).map(a => { const s = hechoPeriodo(a, x, m); return s < a.esperado ? `${etiq(a)} ${a.esperado - s}` : null; }).filter(Boolean);
function alertas(ch, m){
  const prev = mesMas(m, -1);
  const sinNada = ch.filter(x => { const acts = actividades(x.curso); return acts.length && !acts.some(a => num(x.id, m, a) > 0 || num(x.id, prev, a) > 0); });
  const trim = actividades().filter(a => a.esperado && a.periodo === 'trimestre');
  const pend = ch.map(x => ({x, f:trim.filter(a => aplica(a, x.curso) && leToca(a, x) && !cumple(a, x, m)).map(a => a.nombre)})).filter(z => z.f.length);
  return {sinNada, pend, prev};
}

async function migrarV2(){
  if(!esPrincipal() || S.migrando || cfgDoc('migracion').v2) return;
  const viejos = S.eventos.filter(e => !esAct(e));
  if(!viejos.length){ await DB.set('config', 'migracion', {v2:true}, true).catch(() => {}); return; }
  S.migrando = true;
  try{
    const grupos = {}; viejos.forEach(e => { const k = norm(e.nombre).replace(/s$/, ''); (grupos[k] = grupos[k] || []).push(e); });
    const mapa = {}; let orden = 1;
    for(const evs of Object.values(grupos)){
      const e0 = evs[0]; const t = tipoDe(e0); const n = e0.nombre;
      const dato = (t === 'mensual' && !/padre/i.test(n)) || t === 'trimestral' ? 'sino' : 'numero';
      const total = /c[ií]rculo|meditaci/i.test(n) ? 'media_semana' : dato === 'sino' || t === 'ocasional' || t === 'anual' ? 'chicos' : 'suma';
      const id = nuevoId();
      await DB.set('eventos', id, {v:2, nombre:n, abrev:'', dato, total, esperado:null, periodo:'mes', grupo:/c[ií]rculo/i.test(n) ? 'circulo' : /charla/i.test(n) ? 'charla' : '', cursos:e0.cursos || [], orden:orden++}, false);
      evs.forEach(e => mapa[e.id] = id);
    }
    for(const r of S.registros){
      const nuevo = {};
      Object.entries(r.marcas || {}).forEach(([k, v]) => { if(v !== 'si') return; const mm = k.match(/^s_(.+)_\d{4}-\d{2}-\d{2}$/) || k.match(/^[aety]_(.+)$/); const nid = mm && mapa[mm[1]]; if(nid) nuevo['n_' + nid] = (nuevo['n_' + nid] || 0) + 1; });
      if(Object.keys(nuevo).length) await DB.set('registros', r.id, {marcas:nuevo}, true);
    }
    for(const e of viejos) await DB.del('eventos', e.id);
    await DB.set('config', 'migracion', {v2:true}, true);
    toast('Actividades convertidas al nuevo formato. Revisa en Actividades lo esperado de cada una.');
  }catch(e){ console.error(e); toast('No se pudo convertir todo. Avísame si ves datos raros.'); }
  S.migrando = false;
}
async function borrarChicoTodo(x){
  for(const r of S.registros.filter(r => r.chicoId === x.id)) await DB.del('registros', r.id);

}

  const fila = u => {
    const n = S.chicos.filter(x => x.responsable === u.id && x.activo !== false).length; const edit = puedeEditarUsuario(u);

      ${edit && u.rol === 'responsable' && u.activo !== false ? `<label class="sel"><span class="vh">Curso de ${esc(u.nombre)}</span><select data-ch="ucurso" data-id="${u.id}">${CURSOS.map(c => `<option value="${c.id}" ${c.id===u.curso?'selected':''}>${c.corto}</option>`).join('')}</select></label>` : ''}
      ${edit && u.activo !== false ? `<button class="btn sec peq" data-a="uNuevoAcceso" data-id="${u.id}">Nuevo acceso</button>` : ''}
      ${edit ? `<button class="btn sec peq" data-a="uActivo" data-id="${u.id}">${u.activo === false ? 'Activar' : 'Desactivar'}</button>` : ''}${esPrincipal() && u.activo === false && u.id !== S.profile.id ? `<button class="btn sec peq" data-a="uBorrar" data-id="${u.id}">Eliminar</button>` : ''}</li>`;
  };
  const admins = S.usuarios.filter(u => u.rol !== 'responsable').sort((a,b) => (a.rol === 'superadmin' ? -1 : b.rol === 'superadmin' ? 1 : porNombre(a,b)));
  return `${form}<section class="bloque"><div class="bloque-cab"><h2>Administración</h2></div><ul class="lista">${admins.map(fila).join('')}</ul></section>
    ${CURSOS.map(c => { const rs = S.usuarios.filter(u => u.rol === 'responsable' && u.curso === c.id).sort((a,b) => (a.activo === false) - (b.activo === false) || porNombre(a,b));
      return `<section class="bloque">${cabBloque(c.id, `<span class="meta">${rs.filter(r => r.activo !== false).length} preceptores</span>`)}${rs.length ? `<ul class="lista">${rs.map(fila).join('')}</ul>` : vacio('Sin preceptores. Dalos de alta con el formulario de arriba.')}</section>`; }).join('')}`;
}

function finForm(f){ f.reset(); if(document.activeElement) document.activeElement.blur(); render(); }

    if(await guardar(() => DB.set('config', 'recursos', {items:[...(cfgDoc('recursos').items || []), {id:nuevoId(), titulo, url, cursos:cursos.length === CURSOS.length ? [] : cursos}]}, true), 'Documento añadido')) finForm(f);
  },
  async nuevaAct(f){ const d = datosAct(new FormData(f)); if(typeof d === 'string'){ toast(d); return; } d.orden = actividades().length + 1;
    if(await guardar(() => DB.add('eventos', d), `«${d.nombre}» creada`)) finForm(f); },
  async borrarMes(f){ const fd = new FormData(f); const m = fd.get('mes'); const c = fd.get('curso'); if(!m) return;
    const rs = S.registros.filter(r => r.mes === m && (c === 'todos' || r.curso === c));
    const ok = await modal('Borrar ' + mesLargo(m), `<p>Se borrará lo apuntado de ${rs.length} chicos en ${mesLargo(m)} (${c === 'todos' ? 'todos los cursos' : cursoNombre(c)}). No se puede deshacer.</p>`, 'Borrar', true); if(!ok) return;
    await guardar(async () => { for(const r of rs) await DB.del('registros', r.id); }, 'Mes borrado'); if(document.activeElement) document.activeElement.blur(); render(); },
  async informe(f){ if(await guardarFilas(leerFilasInforme())) toast('Informe guardado'); if(document.activeElement) document.activeElement.blur(); render(); },
  async nuevoWidget(f){
    const fd = new FormData(f); const tipo = fd.get('tipo');
    const w = {id:nuevoId(), tipo, titulo:String(fd.get('titulo') || '').trim()};
    if(tipo !== 'anuales'){ w.variable = fd.get('variable'); if(!w.variable){ toast('Crea antes alguna actividad.'); return; } }
    if(await guardarWidgets([...widgetsActuales(), w])){ toast('Gráfico añadido'); finForm(f); }
  },
  async objetivos(f){
    const fd = new FormData(f); const vs = variables();
    const val = v => { const x = String(fd.get('obj_' + v.id) ?? '').trim(); if(x === '') return null; const n = Math.max(0, Math.min(100, Math.round(+x))); return isNaN(n) ? null : n; };
    await guardar(async () => {
      for(const v of vs){ const n = val(v); if(n === v.objetivo) continue;
        if(v.id === '__anuales') await DB.set('config', 'dashboard', {objAnuales:n}, true);
        else if(v.id.startsWith('oc:')) await DB.set('config', 'dashboard', {objOcasionales:{...(cfgDash().objOcasionales || {}), [v.nombre]:n}}, true);
        else await DB.set('eventos', v.id, {objetivo:n}, true); }
      for(const v of vs.filter(x => x.tipo === 'semanal')){ const a = fd.get('agr_' + v.id); if(a && a !== (v.evs[0].agregacion || 'suma')) await DB.set('eventos', v.id, {agregacion:a}, true);
        const fr = fd.get('frq_' + v.id) === '1'; if(fr !== !!v.evs[0].porFrecuencia) await DB.set('eventos', v.id, {porFrecuencia:fr}, true); }
    }, 'Objetivos guardados');
    if(document.activeElement) document.activeElement.blur(); render();
  }
};
const CHANGE = {
  filtroResp(t){ S.filtroResp = t.value; render(); },
  anio(t){ S.anio = +t.value; render(); },
  num(t){ ponerNum(t.dataset.chico, t.dataset.act, +t.value); },
  dashAct(t){ S.dashAct = t.value; render(); },
  infNombres(t){ S.infNombres = t.checked; render(); },
  resp(t){ const x = S.chicos.find(c => c.id === t.dataset.id); if(!x) return; const n = nombreUsuario(t.value);
    guardar(() => DB.set('chicos', x.id, {responsable:t.value}, true), t.value ? `${x.nombre} pasa a ${n}` : `${x.nombre} queda sin preceptor`); },
  grupo(t){ const x = S.chicos.find(c => c.id === t.dataset.id); if(x) guardar(() => DB.set('chicos', x.id, {grupo:t.value}, true), t.value ? `${x.nombre}: ${GRUPOS_CH[t.value]}` : 'Grupo quitado'); },
  ucurso(t){ const u = S.usuarios.find(x => x.id === t.dataset.id); if(!u) return;
    guardar(() => DB.set('usuarios', u.id, {curso:t.value}, true), `${u.nombre} pasa a ${cursoNombre(t.value)}. Reasigna sus chicos anteriores.`); }
};

document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(!b || !CLICK[b.dataset.a]) return; e.preventDefault(); const dl = b.closest('dialog'); if(dl && b.type !== 'submit') dl.close(); CLICK[b.dataset.a](b); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-f]'); if(!f || !SUBMIT[f.dataset.f]) return; e.preventDefault(); SUBMIT[f.dataset.f](f); });
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'nc-curso'){ const s = document.getElementById('nc-resp'); if(s) s.innerHTML = opcionesResp(t.value, ''); return; }
  if((t.name === 'tipo' || t.name === 'modoFecha') && t.form && t.form.querySelector('[data-tipos]')){ ajustarCampos(t.form); return; }
  if(t.id === 'nw-tipo'){ const l = document.getElementById('nw-var'); if(l) l.style.display = t.value === 'anuales' ? 'none' : ''; return; }
  if(t.id === 'nu-rol'){ const l = document.getElementById('nu-curso-l'); if(l) l.style.display = t.value === 'admin' ? 'none' : ''; return; }
  if(t.dataset && CHANGE[t.dataset.ch]) CHANGE[t.dataset.ch](t);
});
document.addEventListener('focusout', () => { if(S.pend) setTimeout(() => { if(S.pend && !editando()) render(); }, 60); });

arrancar();
// Al salir de la app más de 2 minutos, se cierra la sesión.
let ocultoDesde = 0;
document.addEventListener('visibilitychange', () => { if(document.hidden){ ocultoDesde = Date.now(); return; } if(ocultoDesde && S.user && Date.now() - ocultoDesde > 2 * 60 * 1000){ DB.logout(); toast('Sesión cerrada por seguridad. Vuelve a entrar.'); } ocultoDesde = 0; });
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
